<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mis Tareas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ff453a'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- type="module" permite usar import/export entre archivos JS y se ejecuta al cargar el DOM -->
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- ============================ BARRA LATERAL ============================ -->
    <aside class="barra" aria-label="Navegación">
      <label class="buscador">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar" aria-label="Buscar tareas" maxlength="100">
      </label>

      <!-- Vistas rápidas: cada botón filtra el tablero -->
      <nav class="mosaicos" aria-label="Vistas">
        <button type="button" class="mosaico" data-vista="todas" data-acento="azul" aria-pressed="true">
          <span class="mosaico__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-7h11L20 13v5H4z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg></span>
          <span class="mosaico__cuenta" data-cuenta="todas">0</span>
          <span class="mosaico__nombre">Todas</span>
        </button>
        <button type="button" class="mosaico" data-vista="pendientes" data-acento="naranja" aria-pressed="false">
          <span class="mosaico__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg></span>
          <span class="mosaico__cuenta" data-cuenta="pendientes">0</span>
          <span class="mosaico__nombre">Pendientes</span>
        </button>
        <button type="button" class="mosaico" data-vista="alta" data-acento="rojo" aria-pressed="false">
          <span class="mosaico__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg></span>
          <span class="mosaico__cuenta" data-cuenta="alta">0</span>
          <span class="mosaico__nombre">Urgentes</span>
        </button>
        <button type="button" class="mosaico" data-vista="completadas" data-acento="gris" aria-pressed="false">
          <span class="mosaico__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></span>
          <span class="mosaico__cuenta" data-cuenta="completadas">0</span>
          <span class="mosaico__nombre">Completadas</span>
        </button>
      </nav>

      <h2 class="barra__titulo">Prioridades</h2>
      <ul class="listas">
        <li>
          <button type="button" class="lista-item" data-prioridad="alta" data-acento="rojo" aria-pressed="false">
            <span class="lista-item__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v9M12 18.5v.5"/></svg></span>
            <span class="lista-item__nombre">Alta</span>
            <span class="lista-item__cuenta" data-cuenta="p-alta">0</span>
          </button>
        </li>
        <li>
          <button type="button" class="lista-item" data-prioridad="media" data-acento="naranja" aria-pressed="false">
            <span class="lista-item__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg></span>
            <span class="lista-item__nombre">Media</span>
            <span class="lista-item__cuenta" data-cuenta="p-media">0</span>
          </button>
        </li>
        <li>
          <button type="button" class="lista-item" data-prioridad="baja" data-acento="verde" aria-pressed="false">
            <span class="lista-item__icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v11M7.5 12.5L12 17l4.5-4.5"/></svg></span>
            <span class="lista-item__nombre">Baja</span>
            <span class="lista-item__cuenta" data-cuenta="p-baja">0</span>
          </button>
        </li>
      </ul>

      <div class="barra__pie">
        <button type="button" class="enlace-accion" data-nueva>
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Nueva tarea
        </button>
        <a class="enlace-accion" href="/docs" target="_blank" rel="noopener">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg>
          API · Swagger
        </a>
      </div>
    </aside>

    <!-- ============================== CONTENIDO ============================== -->
    <main class="principal" data-acento="azul">
      <div class="herramientas">
        <button type="button" class="icono-btn" data-nueva aria-label="Nueva tarea">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <header class="cabecera">
        <h1 id="titulo-vista" class="cabecera__titulo">Todas</h1>
        <span id="cuenta-vista" class="cabecera__cuenta">0</span>
        <p id="subtitulo-vista" class="cabecera__sub"></p>
        <button type="button" id="toggle-completadas" class="cabecera__accion">Mostrar</button>
      </header>

      <p id="estado" class="estado" role="status"></p>
      <div id="tablero" class="tablero"></div>
    </main>
  </div>

  <!-- ============================== PLANTILLAS ============================== -->
  <!-- El JS clona estas plantillas y las rellena: el HTML se queda en el HTML -->
  <template id="tpl-columna">
    <section class="columna">
      <header class="columna__cabecera">
        <span class="columna__punto" aria-hidden="true"></span>
        <h2 class="columna__titulo"></h2>
        <span class="columna__cuenta"></span>
      </header>
      <ul class="columna__tarjetas"></ul>
      <!-- Alta rápida: escribir y pulsar Enter crea la tarea en esta columna -->
      <form class="tarjeta tarjeta--nueva" autocomplete="off">
        <span class="circulo circulo--fantasma" aria-hidden="true"></span>
        <input name="titulo" maxlength="100" placeholder="Nueva tarea…">
      </form>
    </section>
  </template>

  <template id="tpl-tarjeta">
    <li class="tarjeta">
      <input type="checkbox" class="circulo">
      <button type="button" class="tarjeta__contenido" data-accion="editar">
        <span class="tarjeta__titulo"></span>
        <span class="tarjeta__descripcion"></span>
        <time class="tarjeta__fecha"></time>
      </button>
      <button type="button" class="icono-btn icono-btn--peligro tarjeta__eliminar" data-accion="eliminar">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
    </li>
  </template>

  <!-- =============================== DIÁLOGOS =============================== -->
  <!-- Un solo diálogo para CREAR y EDITAR -->
  <dialog id="dialogo-tarea" class="dialogo" aria-labelledby="titulo-dialogo">
    <form id="form-tarea" class="formulario">
      <h2 id="titulo-dialogo" class="dialogo__titulo">Nueva tarea</h2>
      <label class="campo">
        <span class="campo__etiqueta">Título</span>
        <input class="campo__control" name="titulo" required maxlength="100" placeholder="¿Qué hay que hacer?">
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Notas</span>
        <textarea class="campo__control" name="descripcion" maxlength="500" rows="3" placeholder="Opcional"></textarea>
      </label>
      <fieldset class="campo selector-prioridad">
        <legend class="campo__etiqueta">Prioridad</legend>
        <label data-acento="verde"><input type="radio" name="prioridad" value="baja"><span>Baja</span></label>
        <label data-acento="naranja"><input type="radio" name="prioridad" value="media" checked><span>Media</span></label>
        <label data-acento="rojo"><input type="radio" name="prioridad" value="alta"><span>Alta</span></label>
      </fieldset>
      <label class="campo campo--check" id="campo-completada">
        <input type="checkbox" name="completada">
        <span>Completada</span>
      </label>
      <div class="dialogo__acciones">
        <button type="button" class="boton boton--texto-peligro" id="dialogo-eliminar-btn">Eliminar</button>
        <span class="separador-flex"></span>
        <button type="button" class="boton" data-cerrar>Cancelar</button>
        <button type="submit" class="boton boton--primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-eliminar" class="dialogo dialogo--pequeno" aria-labelledby="titulo-eliminar">
    <form id="form-eliminar" class="formulario">
      <h2 id="titulo-eliminar" class="dialogo__titulo">¿Eliminar tarea?</h2>
      <p class="dialogo__texto">Se eliminará «<strong id="eliminar-nombre"></strong>». Esta acción no se puede deshacer.</p>
      <div class="dialogo__acciones">
        <span class="separador-flex"></span>
        <button type="button" class="boton" data-cerrar>Cancelar</button>
        <button type="submit" class="boton boton--peligro">Eliminar</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
